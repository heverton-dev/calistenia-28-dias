        - heading "1. Instalar o Ollama (Recomendado)" [level=4] [ref=f4e66]
        - paragraph [ref=f4e67]: O Ollama é o gerenciador de LLMs locais mais simples e rápido para Windows com aceleração CUDA nativa.
        - paragraph [ref=f4e68]:
          - text: "Abra o PowerShell e execute:"
          - code [ref=f4e69]: winget install Ollama.Ollama
      - generic [ref=f4e70]:
        - heading "2. Baixar e Rodar o Modelo" [level=4] [ref=f4e71]
        - paragraph [ref=f4e72]: Clique em COPIAR em qualquer um dos modelos acima e cole no terminal PowerShell. O download e inicialização ocorrem automaticamente.
        - paragraph [ref=f4e73]:
          - text: "Exemplo:"
          - code [ref=f4e74]: ollama run qwen2.5-coder:7b
      - generic [ref=f4e75]:
        - heading "3. Ou Usar com Interface Gráfica" [level=4] [ref=f4e76]
        - paragraph [ref=f4e77]: Se preferir uma interface visual tipo ChatGPT offline, instale o LM Studio (lmstudio.ai) ou o Jan (jan.ai). Ambos suportam os mesmos modelos e aceleram via sua GPU RTX.