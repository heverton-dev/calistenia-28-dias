        - heading "1. Instalar o Ollama (Recomendado)" [level=4] [ref=f2e68]
        - paragraph [ref=f2e69]: O Ollama é o gerenciador de LLMs locais mais simples e rápido para Windows com aceleração CUDA nativa.
        - paragraph [ref=f2e70]:
          - text: "Abra o PowerShell e execute:"
          - code [ref=f2e71]: winget install Ollama.Ollama
      - generic [ref=f2e72]:
        - heading "2. Baixar e Rodar o Modelo" [level=4] [ref=f2e73]
        - paragraph [ref=f2e74]: Clique em Copiar em qualquer um dos modelos acima e cole no terminal PowerShell. O download e inicialização ocorrem automaticamente.
        - paragraph [ref=f2e75]:
          - text: "Exemplo:"
          - code [ref=f2e76]: ollama run qwen2.5-coder:7b
      - generic [ref=f2e77]:
        - heading "3. Ou Usar com Interface Gráfica" [level=4] [ref=f2e78]
        - paragraph [ref=f2e79]: Se preferir uma interface visual tipo ChatGPT offline, instale o LM Studio (lmstudio.ai) ou o Jan (jan.ai). Ambos suportam os mesmos modelos e aceleram via sua GPU RTX.